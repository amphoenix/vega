[project]
name = "phoenixtrade-backend"
version = "0.1.0"
description = "PhoenixTrade - AI-Powered Trading Intelligence Platform"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "PhoenixTrade Team" }
]

dependencies = [
    # Core framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    # LLM related
    "openai>=1.0.0",
    # Zep Cloud
    "zep-cloud==3.13.0",
    # OASIS social media simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    # File processing
    "PyMuPDF>=1.24.0",
    # Encoding detection (supports non-UTF-8 text files)
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    # AWS Bedrock (direct — no proxy required)
    "litellm>=1.0.0",
    "boto3>=1.26.0",
    # Market data (yfinance kept as fallback for non-Indian tickers)
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    # Trading & backtesting
    "backtrader>=1.9.78",
    "numpy>=1.24.0",
    # Utility libraries
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "vectorbt>=0.28.5",
    "websocket-client>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
