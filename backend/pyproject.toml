[project]
name = "vega"
version = "0.1.0"
description = "Vega — DDD Lite + Event-Driven Trading Engine"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [{ name = "Aman Kumar" }]

dependencies = [
    # Core framework
    "fastapi>=0.115.0",
    "hypercorn>=0.17.0",
    "aioquic>=1.0.0",
    "sse-starlette>=2.0.0",
    # Config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # LLM
    "openai>=1.0.0",
    "litellm>=1.0.0",
    "boto3>=1.26.0",
    # Market data
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # WebSocket
    "websocket-client>=1.9.0",
    # Broker SDKs
    "dhanhq>=2.0.0",
    "ccxt>=4.0.0",
    "polymarket-client",
    "requests>=2.31.0",
    # Broker memory
    "zep-cloud==3.13.0",
    # Backtesting
    "backtrader>=1.9.78",
    "vectorbt>=0.28.5",
    # HTTP client (signals async fetches)
    "httpx>=0.27.0",
    # Scheduling
    "apscheduler>=3.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff linter / formatter ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes  — unused imports, undefined names, unused vars
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort — import ordering
    "UP",     # pyupgrade — modernize syntax
    "B",      # flake8-bugbear — likely bugs
    "SIM",    # flake8-simplify — simplifiable code
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line length — handled by formatter
    "E741",   # ambiguous variable name (l, O, I) — common in finance code
    "F841",   # local variable assigned but never used — too noisy during dev
    "B008",   # function call in default arg — FastAPI Depends() pattern
    "SIM108", # ternary instead of if-else — readability preference
    "RUF012", # mutable class variable without ClassVar — dataclass pattern
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]     # unused imports in __init__ are re-exports
"tests/*" = ["F811", "B011"] # redefine fixtures, assert True in tests

[tool.ruff.lint.isort]
known-first-party = ["app"]
