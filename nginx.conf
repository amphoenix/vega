# Vega nginx — HTTP/2 reverse proxy in front of Flask.
#
# Browser <─HTTP/2+TLS─> nginx :47291 <─HTTP/1.1─> Flask :47292
#
# Why: HTTP/2 multiplexes unlimited streams over one TCP connection,
# so the browser's 6-connection-per-origin cap (which was killing all
# our SSE streams + XHRs) becomes irrelevant.
#
# Run with: nginx -p . -c nginx.conf
# (-p . makes nginx use the current dir as prefix so all paths are
#  relative to the project root)

worker_processes 1;
daemon off;                          # foreground so start.sh can manage lifecycle
error_log  /dev/stderr  warn;
pid        nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    sendfile on;

    # Keep all nginx scratch state inside the project (no /var, no /tmp).
    client_body_temp_path .nginx_tmp/client_body 1 2;
    proxy_temp_path       .nginx_tmp/proxy       1 2;
    fastcgi_temp_path     .nginx_tmp/fastcgi     1 2;
    uwsgi_temp_path       .nginx_tmp/uwsgi       1 2;
    scgi_temp_path        .nginx_tmp/scgi        1 2;

    # SSE-friendly defaults: no buffering, never time out long-poll
    proxy_buffering          off;
    proxy_cache              off;
    proxy_read_timeout       24h;
    proxy_send_timeout       24h;
    chunked_transfer_encoding off;

    # MIME types — minimal set
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js;
        application/json                      json;
        image/svg+xml                         svg;
    }
    default_type application/octet-stream;

    # ── HTTP/2 + TLS endpoint ─────────────────────────────────────────
    server {
        listen      47291 ssl;
        http2       on;                                 # nginx ≥ 1.25 syntax
        server_name localhost 127.0.0.1;

        ssl_certificate     backend/certs/cert.pem;
        ssl_certificate_key backend/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # All requests forwarded to Flask (now on internal port 47292).
        location / {
            proxy_pass http://127.0.0.1:47292;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        '';      # keep-alive to Flask

            # Re-state SSE-critical settings inside location (some
            # nginx builds don't inherit them from http{} block).
            proxy_buffering off;
            proxy_cache     off;
        }
    }
}
